<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>СУДЬБОНОСНЫЙ ПЛАЦКАРТ — скорый №037 Новосибирск–Москва</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b1512;
        overflow: hidden;
      }
    </style>
    <script>
      // ============================================================
      //  САМОЛЕЧАЩИЙСЯ ЗАГРУЗЧИК
      //  Два режима:
      //   - DEV  (предпросмотр через Vite dev-сервер, /src/main.tsx):
      //     blob-исполнение невозможно (импорты /node_modules/...),
      //     поэтому просто даём больше времени на холодный старт и
      //     при необходимости пере-инжектим входной модуль.
      //   - BUILD (dist, /assets/*.js): бандл самодостаточен — если
      //     штатный тег не сработал, качаем fetch и исполняем из blob
      //     с корректным MIME-типом.
      //  В обоих режимах: как только игра отрапортовала о запуске
      //  (window.__platskartBooted), все сервисные экраны гасятся.
      // ============================================================
      (function () {
        window.__pkDiag = [];
        window.__platskartBooted = false;

        function diag(m) {
          try {
            window.__pkDiag.push('[' + Math.round(performance.now()) + 'ms] ' + m);
          } catch (e) {}
        }
        window.addEventListener(
          'error',
          function (e) {
            diag(
              'error: ' +
                (e && e.message ? e.message : 'unknown') +
                (e && e.filename ? ' @' + String(e.filename).slice(-70) : '')
            );
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          diag('rejection: ' + (e && e.reason ? String(e.reason).slice(0, 200) : 'unknown'));
        });

        var IS_DEV = !!document.querySelector('script[src^="/src/"]');
        diag('mode: ' + (IS_DEV ? 'dev-server' : 'build'));

        var root = document.getElementById('root');

        // --- плашка «формируется состав» вместо зелёного фона ---
        var boot = document.createElement('div');
        boot.id = 'pkBoot';
        boot.style.cssText =
          'position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;align-items:center;' +
          'justify-content:center;background:#0b1512;z-index:99998;font-family:Rubik,Arial,sans-serif;';
        boot.innerHTML =
          '<div style="font-family:\'Press Start 2P\',monospace;font-size:13px;letter-spacing:0.22em;' +
          'color:#ffc24b;text-shadow:0 0 18px rgba(255,194,75,0.5);animation:pkBlink 1.1s steps(2) infinite;">' +
          'СОСТАВ ФОРМИРУЕТСЯ…</div>' +
          '<div id="pkBootStatus" style="font-size:13px;color:rgba(232,224,204,0.65);">' +
          'подаём вагон к перрону</div>' +
          '<style>@keyframes pkBlink{50%{opacity:.45}}</style>';
        root.appendChild(boot);

        function removeBoot() {
          var b = document.getElementById('pkBoot');
          if (b && b.parentNode) b.parentNode.removeChild(b);
        }
        function setBootStatus(t) {
          var el = document.getElementById('pkBootStatus');
          if (el) el.textContent = t;
        }
        function removeFail() {
          var f = document.getElementById('pkFail');
          if (f && f.parentNode) f.parentNode.removeChild(f);
        }

        // как только игра запустилась — гасим всё сервисное
        setInterval(function () {
          if (window.__platskartBooted) {
            removeBoot();
            removeFail();
          }
        }, 700);

        function showFailure(title, text) {
          removeBoot();
          if (document.getElementById('pkFail')) return;
          var box = document.createElement('div');
          box.id = 'pkFail';
          box.style.cssText =
            'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
            'background:#0b1512;padding:24px;font-family:Rubik,Arial,sans-serif;color:#e8e0cc;z-index:99999;';
          var panel = document.createElement('div');
          panel.style.cssText =
            'max-width:560px;width:100%;border:2px solid rgba(255,194,75,0.5);border-radius:10px;' +
            'background:#101f1a;padding:28px;text-align:center;';
          panel.innerHTML =
            '<div style="font-family:\'Press Start 2P\',monospace;font-size:13px;letter-spacing:0.2em;' +
            'color:#ff8a70;">' + title + '</div>' +
            '<p style="margin:16px 0 0;font-size:14px;line-height:1.55;">' + text + '</p>' +
            '<pre id="pkDiagBox" style="margin:16px 0 0;padding:12px;max-height:180px;overflow:auto;text-align:left;' +
            'font-size:11px;line-height:1.5;color:#8fd6b8;background:#0a1712;border-radius:6px;' +
            'white-space:pre-wrap;word-break:break-word;"></pre>';
          var b1 = document.createElement('button');
          b1.textContent = 'ПЕРЕЗАГРУЗИТЬ';
          b1.style.cssText =
            'margin:20px 8px 0;padding:12px 22px;border:none;border-radius:6px;cursor:pointer;' +
            'font-family:\'Press Start 2P\',monospace;font-size:10px;letter-spacing:0.12em;' +
            'color:#1d0e02;background:#ffc24b;';
          b1.onclick = function () { location.reload(); };
          var b2 = document.createElement('button');
          b2.textContent = 'ДИАГНОСТИКА';
          b2.style.cssText =
            'margin:20px 0 0;padding:12px 22px;border:1px solid rgba(255,194,75,0.5);border-radius:6px;' +
            'cursor:pointer;font-family:\'Press Start 2P\',monospace;font-size:10px;letter-spacing:0.12em;' +
            'color:#ffc24b;background:transparent;';
          b2.onclick = function () {
            var lines = (window.__pkDiag || []).slice();
            lines.push('ua=' + navigator.userAgent);
            location.href =
              'mailto:?subject=platskart-diag&body=' + encodeURIComponent(lines.join('\n'));
          };
          panel.appendChild(b1);
          panel.appendChild(b2);
          box.appendChild(panel);
          root.appendChild(box);
          var pre = document.getElementById('pkDiagBox');
          if (pre) pre.textContent = (window.__pkDiag || []).join('\n') || '(диагностика пуста)';
        }

        function wait(ms) {
          return new Promise(function (r) { setTimeout(r, ms); });
        }
        function injectModule(src) {
          var s = document.createElement('script');
          s.type = 'module';
          s.src = src;
          document.head.appendChild(s);
          diag('re-inject module: ' + src);
        }
        async function fetchToBlob(path, mime) {
          var variants = [path, './' + path.replace(/^\//, ''), path.replace(/^\//, '')];
          for (var i = 0; i < variants.length; i++) {
            var v = variants[i];
            try {
              var r = await fetch(v, { cache: 'no-store' });
              diag('fetch ' + v + ' -> ' + r.status);
              if (r.ok) {
                return URL.createObjectURL(new Blob([await r.text()], { type: mime }));
              }
            } catch (err) {
              diag('fetch ' + v + ' failed: ' + err);
            }
          }
          return null;
        }

        setTimeout(async function () {
          if (window.__platskartBooted) { removeBoot(); return; }
          diag('primary boot timeout (4s)');
          setBootStatus('чуть дольше обычного…');

          if (IS_DEV) {
            // ---- режим dev-сервера ----
            // Пере-инжектим входной модуль (помогает после холодного старта
            // и неудачной оптимизации зависимостей) и ждём дольше:
            // первая компиляция проекта бывает медленной.
            var entry =
              document.querySelector('script[src^="/src/main"]') ||
              document.querySelector('script[src^="/src/"]');
            if (entry) {
              var src = entry.getAttribute('src') || '';
              injectModule(src + (src.indexOf('?') === -1 ? '?' : '&') + 'pkretry=1');
            }
            var waited = 0;
            while (waited < 11000 && !window.__platskartBooted) {
              setBootStatus('первая compilation… ' + Math.round((4000 + waited) / 1000) + ' c');
              await wait(500);
              waited += 500;
            }
            if (!window.__platskartBooted) {
              // ещё одна попытка и финальное ожидание
              if (entry) injectModule(entry.getAttribute('src') + '?pkretry=2&t=' + Date.now());
              var more = 0;
              while (more < 6000 && !window.__platskartBooted) {
                await wait(500);
                more += 500;
              }
            }
            if (!window.__platskartBooted) {
              showFailure(
                'СБОЙ НА ЛИНИИ',
                'Дев-сервер не отдал игру за 20 секунд. Обычно помогает перезагрузка страницы.'
              );
            }
            return;
          }

          // ---- режим сборки (dist) ----
          // Штатные теги не исполнились (чаще всего — сервер отдаёт JS
          // с неверным MIME-типом). Скрипт сборки самодостаточен, поэтому
          // качаем его fetch и исполняем из blob как text/javascript.
          var scriptEl =
            document.querySelector('script[src*="/assets/"]') ||
            document.querySelector('script[src$=".js"]');
          var cssEl = document.querySelector('link[rel="stylesheet"][href*="/assets/"]');
          if (!scriptEl) {
            showFailure('СБОЙ НА ЛИНИИ', 'Не найден скрипт игры в странице.');
            return;
          }
          setBootStatus('запасная загрузка…');
          diag('rescue: fallback loader');

          var cssUrl = cssEl ? await fetchToBlob(cssEl.getAttribute('href'), 'text/css') : null;
          if (cssUrl) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = cssUrl;
            document.head.appendChild(l);
          }
          var jsUrl = await fetchToBlob(scriptEl.getAttribute('src'), 'text/javascript');
          if (!jsUrl) {
            showFailure(
              'СБОЙ НА ЛИНИИ',
              'Не удалось скачать скрипт игры ни по одному адресу.'
            );
            return;
          }
          var s = document.createElement('script');
          s.type = 'text/javascript';
          s.src = jsUrl;
          s.onerror = function () {
            diag('blob script onerror');
            showFailure('СБОЙ НА ЛИНИИ', 'Скрипт загружен, но не исполнился.');
          };
          document.body.appendChild(s);
          diag('blob script injected');

          var waited2 = 0;
          while (waited2 < 6000 && !window.__platskartBooted) {
            await wait(250);
            waited2 += 250;
          }
          if (!window.__platskartBooted) {
            showFailure(
              'СБОЙ НА ЛИНИИ',
              'Скрипт загружен, но игра не запустилась. Ниже — диагностика:'
            );
          }
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>СУДЬБОНОСНЫЙ ПЛАЦКАРТ — скорый №037 Новосибирск–Москва</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b1512;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // «Сторожевой таймер» запуска: если игра не отрисовалась за 5 секунд,
      // показываем реальную причину вместо зелёного фона.
      window.__platskartError = null;
      window.addEventListener('error', function (e) {
        window.__platskartError = e && e.message ? e.message : 'Неизвестная ошибка скрипта';
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__platskartError =
          'Promise: ' + (e && e.reason ? String(e.reason) : 'неизвестная ошибка');
      });
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var msg =
            window.__platskartError ||
            'Скрипт игры не загрузился: файл /assets/… не найден. Скорее всего, предпросмотр открыт по вложенному пути или показывает устаревшую сборку.';
          root.innerHTML =
            '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;">' +
            '<div style="max-width:540px;background:#12241d;border:2px solid #d0402e;border-radius:10px;padding:26px;text-align:center;color:#e8e0cc;font-family:monospace;">' +
            '<div style="font-size:15px;letter-spacing:3px;color:#ff8a70;margin-bottom:14px;">СБОЙ НА ЛИНИИ</div>' +
            '<div style="font-size:13px;line-height:1.55;">' + msg + '</div>' +
            '<button onclick="location.reload()" style="margin-top:18px;padding:11px 22px;background:#d0402e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">ПЕРЕЗАПУСТИТЬ СОСТАВ</button>' +
            '</div></div>';
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>СУДЬБОНОСНЫЙ ПЛАЦКАРТ — скорый №037 Новосибирск–Москва</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b1512;
        overflow: hidden;
      }
    </style>
    <script>
      // ============================================================
      //  САМОВОССТАНАВЛИВАЮЩИЙСЯ ЗАГРУЗЧИК
      //  1) ждёт штатный запуск игры (флаг __platskartBooted);
      //  2) если не запустилась — скачивает скрипт и стили обычным
      //     fetch (ему не важен MIME-тип ответа и «странности» пути),
      //     затем исполняет их из blob с правильным типом;
      //  3) если ничего не помогло — показывает диагностику.
      // ============================================================
      (function () {
        window.__platskartBooted = false;
        window.__pkDiag = [];

        function diag(msg) {
          window.__pkDiag.push(msg);
        }

        window.addEventListener('error', function (e) {
          diag('onerror: ' + (e && e.message ? e.message : '(без текста)'));
        });
        window.addEventListener('unhandledrejection', function (e) {
          diag('rejection: ' + String(e && e.reason));
        });

        function showFailure(title, detail) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '';
          var box = document.createElement('div');
          box.style.cssText =
            'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
            'background:#0b1512;padding:24px;font-family:Rubik,Arial,sans-serif;color:#e8e0cc;';
          var panel = document.createElement('div');
          panel.style.cssText =
            'max-width:560px;width:100%;border:2px solid rgba(255,194,75,0.5);border-radius:10px;' +
            'background:#101f1a;padding:28px;text-align:center;';
          var h = document.createElement('div');
          h.textContent = title;
          h.style.cssText =
            'font-family:"Press Start 2P",monospace;font-size:14px;letter-spacing:0.2em;color:#ff8a70;';
          var p = document.createElement('p');
          p.textContent = detail;
          p.style.cssText = 'margin:16px 0 0;font-size:14px;line-height:1.5;';
          var d = document.createElement('pre');
          d.textContent = window.__pkDiag.join('\n') || '(диагностика пуста)';
          d.style.cssText =
            'margin:16px 0 0;padding:12px;max-height:180px;overflow:auto;text-align:left;' +
            'font-size:11px;line-height:1.5;color:#8fd6b8;background:#0a1712;border-radius:6px;' +
            'white-space:pre-wrap;word-break:break-word;';
          var b = document.createElement('button');
          b.textContent = 'ПЕРЕЗАПУСТИТЬ СОСТАВ';
          b.style.cssText =
            'margin-top:20px;padding:12px 22px;border:none;border-radius:6px;cursor:pointer;' +
            'font-family:"Press Start 2P",monospace;font-size:10px;letter-spacing:0.15em;' +
            'color:#1d0e02;background:#ffc24b;';
          b.onclick = function () {
            location.reload();
          };
          panel.appendChild(h);
          panel.appendChild(p);
          panel.appendChild(d);
          panel.appendChild(b);
          box.appendChild(panel);
          root.appendChild(box);
        }

        // кандидаты: абсолютный, ./относительный и «голый» относительный
        function candidatesFor(url) {
          var clean = String(url).replace(/^[.]\//, '');
          var bare = clean.charAt(0) === '/' ? clean.slice(1) : clean;
          return [url, './' + bare, bare];
        }

        function fetchText(url) {
          return fetch(url, { cache: 'no-store' })
            .then(function (res) {
              diag('fetch ' + url + ' -> ' + res.status);
              return res.ok ? res.text() : null;
            })
            .catch(function (err) {
              diag('fetch ' + url + ' -> ' + err);
              return null;
            });
        }

        function fetchFirst(cands) {
          return cands.reduce(function (acc, url) {
            return acc.then(function (found) {
              return found !== null ? found : fetchText(url);
            });
          }, Promise.resolve(null));
        }

        function runModuleFromBlob(text) {
          var blob = new Blob([text], { type: 'text/javascript' });
          var u = URL.createObjectURL(blob);
          var s = document.createElement('script');
          s.type = 'module';
          s.src = u;
          document.head.appendChild(s);
        }

        function cssFromBlob(text) {
          var blob = new Blob([text], { type: 'text/css' });
          var u = URL.createObjectURL(blob);
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = u;
          document.head.appendChild(l);
        }

        function wait(ms) {
          return new Promise(function (r) {
            setTimeout(r, ms);
          });
        }

        setTimeout(async function () {
          if (window.__platskartBooted) return;
          diag('штатный запуск не произошёл за 4 с — запасная загрузка');

          // стили (локальные, не трогая Google Fonts)
          var links = Array.prototype.slice.call(
            document.querySelectorAll('link[rel="stylesheet"]')
          );
          for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href');
            if (!href || /^(https?:|blob:|data:)/.test(href)) continue;
            var cssText = await fetchFirst(candidatesFor(href));
            if (cssText !== null) cssFromBlob(cssText);
          }

          // модульные скрипты
          var mods = Array.prototype.slice.call(
            document.querySelectorAll('script[type="module"][src]')
          );
          if (mods.length === 0) {
            showFailure('СБОЙ НА ЛИНИИ', 'В странице не найден скрипт игры.');
            return;
          }
          for (var a = 0; a < mods.length; a++) {
            var src = mods[a].getAttribute('src');
            var jsText = await fetchFirst(candidatesFor(src));
            if (jsText === null) {
              showFailure(
                'СБОЙ НА ЛИНИИ',
                'Не удалось скачать скрипт игры ни по одному адресу. Ниже — диагностика:'
              );
              return;
            }
            if (window.__platskartBooted) return; // штатный скрипт всё-таки догнал
            runModuleFromBlob(jsText);
          }

          // даём игре запуститься из blob
          var waited = 0;
          while (waited < 5000 && !window.__platskartBooted) {
            await wait(250);
            waited += 250;
          }
          if (!window.__platskartBooted) {
            showFailure(
              'СБОЙ НА ЛИНИИ',
              'Скрипт загружен, но игра не запустилась. Ниже — диагностика:'
            );
          }
        }, 4000);

        // Последний рубеж: если через 12 с на экране всё ещё пусто
        // (даже панель «СБОЙ НА ЛИНИИ» не появилась) — рисуем её вручную
        // и даём кнопку, чтобы отправить диагностику.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (window.__platskartBooted || !root) return;
          var hasSomething = false;
          var ch = root.children;
          for (var i = 0; i < ch.length; i++) {
            var r = ch[i].getBoundingClientRect();
            if (r.width > 120 && r.height > 120) {
              hasSomething = true;
              break;
            }
          }
          if (hasSomething) return;
          var box = document.createElement('div');
          box.style.cssText =
            'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
            'background:#0b1512;padding:24px;font-family:Rubik,Arial,sans-serif;color:#e8e0cc;z-index:99999;';
          var panel = document.createElement('div');
          panel.style.cssText =
            'max-width:520px;width:100%;border:2px solid rgba(255,194,75,0.5);border-radius:10px;' +
            'background:#101f1a;padding:28px;text-align:center;';
          panel.innerHTML =
            '<div style="font-family:\'Press Start 2P\',monospace;font-size:13px;letter-spacing:0.2em;color:#ff8a70;">СБОЙ НА ЛИНИИ</div>' +
            '<p style="margin:16px 0 0;font-size:14px;line-height:1.5;">Экран пуст, и диагностика не сработала автоматически. ' +
            'Нажмите кнопку ниже — откроется письмо с данными об ошибке, перешлите его содержимое.</p>' +
            '<pre id="pkDiagBox" style="margin:16px 0 0;padding:12px;max-height:160px;overflow:auto;text-align:left;' +
            'font-size:11px;line-height:1.5;color:#8fd6b8;background:#0a1712;border-radius:6px;white-space:pre-wrap;word-break:break-word;"></pre>';
          var b = document.createElement('button');
          b.textContent = 'ОТПРАВИТЬ ДИАГНОСТИКУ';
          b.style.cssText =
            'margin-top:20px;padding:12px 22px;border:none;border-radius:6px;cursor:pointer;' +
            'font-family:\'Press Start 2P\',monospace;font-size:10px;letter-spacing:0.12em;' +
            'color:#1d0e02;background:#ffc24b;';
          b.onclick = function () {
            var lines = (window.__pkDiag || []).slice();
            lines.push('root.children=' + root.children.length);
            var cs = root.children;
            for (var k = 0; k < cs.length; k++) {
              var rr = cs[k].getBoundingClientRect();
              lines.push(
                '  child[' + k + '] ' + cs[k].tagName + ' ' + Math.round(rr.width) + 'x' + Math.round(rr.height)
              );
            }
            lines.push('ua=' + navigator.userAgent);
            location.href = 'mailto:?subject=platskart-diag&body=' + encodeURIComponent(lines.join('\n'));
          };
          box.appendChild(panel);
          panel.appendChild(b);
          root.appendChild(box);
          var pre = document.getElementById('pkDiagBox');
          if (pre) pre.textContent = (window.__pkDiag || []).join('\n') || '(диагностика пуста)';
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: #0b1512;
          color: #ffc24b;
          font-family: 'Press Start 2P', monospace;
        "
      >
        <div style="font-size: 12px; letter-spacing: 0.2em; animation: pkblink 1.1s steps(2) infinite">
          СОСТАВ ФОРМИРУЕТСЯ…
        </div>
        <div style="font-size: 8px; letter-spacing: 0.15em; color: #5d8a7b">ПУТЬ 037 · НОВОСИБИРСК → МОСКВА</div>
        <style>
          @keyframes pkblink {
            50% {
              opacity: 0.25;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
